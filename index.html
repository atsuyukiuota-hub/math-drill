<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>けいさんドリル</title>
<style>
  :root{
    --bg:#fff7ec;
    --card:#ffffff;
    --ink:#3b3024;
    --sub:#8a7a66;
    --line:#ffe0b8;
    --plus:#ff9f43;
    --plus2:#f06595;
    --minus:#4dabf7;
    --accent:#ff8a3d;
    --ok:#37b24d;
    --shadow:0 6px 0 rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 12% 8%, #fff2d8 0 22%, transparent 22.5%),
      radial-gradient(circle at 88% 4%, #ffe8ee 0 18%, transparent 18.5%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px;}

  h1{
    text-align:center;
    font-size:clamp(22px,6vw,32px);
    margin:12px 0 4px;
    letter-spacing:.06em;
  }
  .lead{text-align:center;color:var(--sub);font-size:14px;margin:0 0 16px;}

  /* ---- モード切替 ---- */
  .modes{display:flex;gap:10px;justify-content:center;margin-bottom:12px;flex-wrap:wrap;}
  .mode-btn{
    font-family:inherit;
    font-size:clamp(16px,4.2vw,20px);
    font-weight:700;
    padding:12px 22px;
    border-radius:999px;
    border:3px solid var(--line);
    background:#fff;
    color:var(--sub);
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .12s ease, background .2s, color .2s, border-color .2s;
  }
  .mode-btn:active{transform:translateY(3px);box-shadow:none;}
  .mode-btn.active[data-op="+"]{background:var(--plus);border-color:var(--plus);color:#fff;}
  .mode-btn.active[data-op="-"]{background:var(--minus);border-color:var(--minus);color:#fff;}

  /* ---- レベル切替 ---- */
  .levels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .lv-btn{
    font-family:inherit;
    font-size:clamp(14px,3.8vw,17px);
    font-weight:700;
    padding:8px 16px;
    border-radius:999px;
    border:3px solid var(--line);
    background:#fff;
    color:var(--sub);
    cursor:pointer;
    transition:background .2s, color .2s, border-color .2s;
  }
  .lv-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .lv-desc{text-align:center;color:var(--sub);font-size:14px;font-weight:700;margin:8px 0 14px;min-height:20px;}

  /* ---- 進捗 ---- */
  .progress{display:flex;align-items:center;gap:10px;margin:0 4px 12px;}
  .bar{flex:1;height:14px;background:#fff;border:3px solid var(--line);border-radius:999px;overflow:hidden;}
  .bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .4s ease;}
  .count{font-weight:700;font-size:16px;white-space:nowrap;color:var(--sub);}

  /* ---- カード ---- */
  .card{
    background:var(--card);
    border:4px solid var(--line);
    border-radius:26px;
    padding:20px 16px 24px;
    box-shadow:0 10px 0 rgba(0,0,0,.06);
    text-align:center;
  }
  .qno{font-size:14px;color:var(--sub);font-weight:700;letter-spacing:.1em;}
  .quiz{
    font-size:clamp(36px,12vw,68px);
    font-weight:700;
    letter-spacing:.04em;
    margin:6px 0 4px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .quiz.long{font-size:clamp(26px,8vw,60px);}
  .quiz .op-plus{color:var(--plus);}
  .quiz .op-minus{color:var(--minus);}
  .answer{
    display:inline-block;
    min-width:1.4em;
    color:var(--ok);
    opacity:0;
    transform:translateY(10px) scale(.6);
    transition:opacity .3s, transform .35s cubic-bezier(.2,1.6,.4,1);
  }
  .answer.show{opacity:1;transform:none;}

  /* ---- まる ---- */
  /* よこは 10こまで。11こめからは したの だんに ならべる */
  .dots{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:clamp(4px,1.4vw,10px);
    justify-items:center;
    max-width:560px;
    margin:14px auto 6px;
    min-height:50px;
  }
  .dot{
    width:clamp(22px,6.6vw,46px);
    height:clamp(22px,6.6vw,46px);
    border-radius:50%;
    border:3px solid var(--ink);
    background:#fff;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(11px,3.3vw,20px);
    font-weight:700;
    line-height:1;
    font-variant-numeric:tabular-nums;
    opacity:0;
    transform:scale(.2);
    transition:opacity .2s ease, transform .3s cubic-bezier(.2,1.7,.4,1),
               background-color .3s ease, border-color .3s ease, color .3s ease;
  }
  .dot.pop{opacity:1;transform:scale(1);}
  .dot.fill{background:var(--ink);color:#fff;}
  .dot.c1{border-color:var(--plus);background:var(--plus);color:#fff;}
  .dot.c2{border-color:var(--plus2);background:var(--plus2);color:#fff;}
  .dot.gone{opacity:0;transform:scale(.2);}
  .dot.bounce{animation:bounce .4s ease;}
  @keyframes bounce{
    0%{transform:scale(1);}
    40%{transform:scale(1.28);}
    100%{transform:scale(1);}
  }
  .hint{color:var(--sub);font-size:14px;min-height:22px;margin:4px 0 0;font-weight:700;}

  /* ---- ボタン ---- */
  .actions{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
  .btn{
    font-family:inherit;font-weight:700;
    font-size:clamp(17px,4.6vw,21px);
    padding:14px 30px;border-radius:999px;border:none;cursor:pointer;
    background:var(--accent);color:#fff;box-shadow:0 5px 0 #d96f28;
    transition:transform .1s ease, box-shadow .1s ease, opacity .2s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d96f28;}
  .btn:disabled{opacity:.45;cursor:default;transform:none;}
  [hidden]{display:none !important;}

  /* ---- 結果 ---- */
  .result{text-align:center;padding:30px 16px;}
  .result .big{font-size:clamp(34px,10vw,56px);margin:6px 0;font-weight:700;}
  .result p{font-size:18px;color:var(--sub);font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐣 けいさんドリル</h1>
  <p class="lead">こたえボタンを おすと まるで おしえてくれるよ</p>

  <div class="modes">
    <button class="mode-btn active" data-op="+" type="button">➕ たしざん</button>
    <button class="mode-btn" data-op="-" type="button">➖ ひきざん</button>
  </div>

  <div class="levels">
    <button class="lv-btn active" data-lv="1" type="button">レベル1</button>
    <button class="lv-btn" data-lv="2" type="button">レベル2</button>
    <button class="lv-btn" data-lv="3" type="button">レベル3</button>
  </div>
  <p class="lv-desc" id="lvDesc"></p>

  <div class="progress">
    <div class="bar"><span id="barFill"></span></div>
    <div class="count" id="count">1 / 10</div>
  </div>

  <div class="card" id="quizCard">
    <div class="qno" id="qno">だい 1 もん</div>
    <div class="quiz" id="quiz"></div>
    <div class="dots" id="dots"></div>
    <p class="hint" id="hint"></p>
    <div class="actions">
      <button class="btn" id="showBtn" type="button">こたえ</button>
      <button class="btn" id="nextBtn" type="button" hidden>つぎの もんだい →</button>
    </div>
  </div>

  <div class="card result" id="resultCard" hidden>
    <div class="big">🎉</div>
    <div class="big">10もん おわり！</div>
    <p>よく がんばりました！</p>
    <div class="actions">
      <button class="btn" id="againBtn" type="button">もういちど</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var TOTAL = 10;
  var op = "+";
  var level = 1;
  var questions = [];
  var index = 0;
  var timers = [];
  var answering = false;

  var LEVEL_DESC = {
    "+": {
      1: "1けた ＋ 1けた（こたえは 9まで）",
      2: "1けた ＋ 1けた（こたえは 10いじょう）",
      3: "1けた ＋ 1けた ＋ 1けた（こたえは 10いじょう）"
    },
    "-": {
      1: "1けた － 1けた",
      2: "2けた － 1けた（こたえは 10いじょう）",
      3: "2けた － 1けた ＋ 1けた"
    }
  };

  var el = {
    quiz: document.getElementById("quiz"),
    dots: document.getElementById("dots"),
    hint: document.getElementById("hint"),
    qno: document.getElementById("qno"),
    count: document.getElementById("count"),
    bar: document.getElementById("barFill"),
    lvDesc: document.getElementById("lvDesc"),
    showBtn: document.getElementById("showBtn"),
    nextBtn: document.getElementById("nextBtn"),
    againBtn: document.getElementById("againBtn"),
    quizCard: document.getElementById("quizCard"),
    resultCard: document.getElementById("resultCard")
  };

  function rand(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

  function clearTimers(){
    timers.forEach(clearTimeout);
    timers = [];
  }
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  // terms: [{n: かず, s: "+" or "-"}]（さいしょの s は つかわない）
  function q(nums, signs){
    var terms = [], ans = 0;
    for (var i = 0; i < nums.length; i++){
      var s = i === 0 ? "+" : signs[i - 1];
      terms.push({ n: nums[i], s: s });
      ans += s === "+" ? nums[i] : -nums[i];
    }
    return { terms: terms, ans: ans };
  }

  function makeQuestion(){
    var a, b, c;
    if (op === "+"){
      if (level === 1){                 // 1けた＋1けた＝1けた
        a = rand(1, 8);
        b = rand(1, 9 - a);
        return q([a, b], ["+"]);
      }
      if (level === 2){                 // 1けた＋1けた＝2けた（くりあがり）
        a = rand(1, 9);
        b = rand(10 - a, 9);
        return q([a, b], ["+"]);
      }
      do {                              // 1けた＋1けた＋1けた＝2けた
        a = rand(1, 9); b = rand(1, 9); c = rand(1, 9);
      } while (a + b + c < 10);
      return q([a, b, c], ["+", "+"]);
    }
    if (level === 1){                   // 1けた－1けた＝1けた
      a = rand(2, 9);
      b = rand(1, a);
      return q([a, b], ["-"]);
    }
    if (level === 2){                   // 2けた－1けた＝2けた（11〜19から ひく）
      a = rand(11, 19);
      b = rand(1, a - 10);
      return q([a, b], ["-"]);
    }
    a = rand(10, 19);                   // 2けた－1けた＋1けた（10〜19から）
    b = rand(1, 9);
    c = rand(1, 9);
    return q([a, b, c], ["-", "+"]);
  }

  function keyOf(x){ return x.terms.map(function(t){ return t.s + t.n; }).join(""); }

  function buildSet(){
    questions = [];
    var prev = "";
    for (var i = 0; i < TOTAL; i++){
      var x, tries = 0;
      do { x = makeQuestion(); tries++; } while (keyOf(x) === prev && tries < 20);
      prev = keyOf(x);
      questions.push(x);
    }
    index = 0;
  }

  function renderQuestion(){
    clearTimers();
    answering = false;
    var x = questions[index];
    var html = "";
    x.terms.forEach(function(t, i){
      if (i > 0){
        html += t.s === "+"
          ? ' <span class="op-plus">＋</span> '
          : ' <span class="op-minus">－</span> ';
      }
      html += t.n;
    });
    html += ' ＝ <span class="answer" id="ansText">' + x.ans + '</span>';
    el.quiz.innerHTML = html;
    el.quiz.classList.toggle("long", x.terms.length > 2);
    el.dots.innerHTML = "";
    el.hint.textContent = "";
    el.qno.textContent = "だい " + (index + 1) + " もん";
    el.count.textContent = (index + 1) + " / " + TOTAL;
    el.bar.style.width = (index / TOTAL * 100) + "%";
    el.showBtn.hidden = false;
    el.showBtn.disabled = false;
    el.nextBtn.hidden = true;
  }

  function rebounce(node){
    node.classList.remove("bounce");
    void node.offsetWidth;
    node.classList.add("bounce");
  }

  function showAnswer(){
    if (answering) return;
    answering = true;
    el.showBtn.disabled = true;
    var x = questions[index];
    el.dots.innerHTML = "";

    // とちゅうで いちばん おおく ならぶ かず
    var run = 0, peak = 0;
    x.terms.forEach(function(t){ run += t.s === "+" ? t.n : 0; peak = Math.max(peak, run); if (t.s === "-") run -= t.n; });
    var many = peak > 10;

    var STEP = many ? 130 : 220;   // まるが 1つ でる かんかく
    var live = [];                  // いま ならんでいる まる
    var t = 0;
    var last = x.terms.length - 1;
    var remain = 0;

    function addDots(n, cls, t0){
      for (var k = 0; k < n; k++){
        later(function(){
          var d = document.createElement("div");
          d.className = "dot" + (cls ? " " + cls : "");
          el.dots.appendChild(d);
          live.push(d);
          d.textContent = live.length;   // 1, 2, 3 … と かぞえる
          void d.offsetWidth;
          d.classList.add("pop");
          if (cls) rebounce(d);
        }, t0 + k * STEP);
      }
    }

    function takeDots(n, t0){
      for (var k = 0; k < n; k++){
        (function(kk){
          later(function(){
            var d = live[live.length - 1 - kk];
            d.classList.add("fill");
            rebounce(d);
          }, t0 + kk * STEP);
        })(k);
      }
    }

    x.terms.forEach(function(term, ti){
      var n = term.n;
      if (ti === 0){
        later(function(){ el.hint.textContent = "まず " + n + "こ ならべるよ"; }, 0);
        addDots(n, "", t);
        remain = n;
        t += n * STEP + 450;
      } else if (term.s === "+"){
        later(function(){ el.hint.textContent = "そこに " + n + "こ たすよ"; }, t - 250);
        addDots(n, "c" + Math.min(ti, 2), t);
        remain += n;
        t += n * STEP + 350;
      } else {
        later(function(){ el.hint.textContent = n + "こ とるよ （くろまる）"; }, t - 250);
        takeDots(n, t);
        remain -= n;
        t += n * STEP + 350;
        if (ti !== last){
          // つぎの けいさんの まえに とった まるを どける
          var left = remain;
          later(function(){
            el.hint.textContent = "のこりは " + left + "こ";
            var gone = live.splice(live.length - n, n);
            gone.forEach(function(d){ d.classList.add("gone"); });
            later(function(){ gone.forEach(function(d){ d.remove(); }); }, 350);
          }, t);
          t += 1100;
        }
      }
    });

    var lastIsMinus = x.terms[last].s === "-";
    var bounceGap = many ? 45 : (lastIsMinus ? 90 : 70);
    later(function(){
      el.hint.textContent = lastIsMinus
        ? "のこりは しろまる " + x.ans + "こ！"
        : "ぜんぶで " + x.ans + "こ！";
      var shown = live.filter(function(d){ return !d.classList.contains("fill"); });
      shown.forEach(function(d, m){ later(function(){ rebounce(d); }, m * bounceGap); });
    }, t);
    t += Math.max(x.ans, 1) * bounceGap + 400;

    later(function(){
      var ans = document.getElementById("ansText");
      if (ans) ans.classList.add("show");
      el.showBtn.hidden = true;
      el.nextBtn.hidden = false;
      el.nextBtn.textContent = (index === TOTAL - 1) ? "けっかを みる →" : "つぎの もんだい →";
      answering = false;
    }, t);
  }

  function next(){
    if (index === TOTAL - 1){
      clearTimers();
      el.bar.style.width = "100%";
      el.count.textContent = TOTAL + " / " + TOTAL;
      el.quizCard.hidden = true;
      el.resultCard.hidden = false;
      return;
    }
    index++;
    renderQuestion();
  }

  function restart(){
    el.resultCard.hidden = true;
    el.quizCard.hidden = false;
    el.lvDesc.textContent = LEVEL_DESC[op][level];
    buildSet();
    renderQuestion();
  }

  function selectIn(selector, btn){
    Array.prototype.forEach.call(document.querySelectorAll(selector), function(b){
      b.classList.toggle("active", b === btn);
    });
  }

  // ---- イベント ----
  Array.prototype.forEach.call(document.querySelectorAll(".mode-btn"), function(btn){
    btn.addEventListener("click", function(){
      selectIn(".mode-btn", btn);
      op = btn.getAttribute("data-op");
      restart();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".lv-btn"), function(btn){
    btn.addEventListener("click", function(){
      selectIn(".lv-btn", btn);
      level = Number(btn.getAttribute("data-lv"));
      restart();
    });
  });
  el.showBtn.addEventListener("click", showAnswer);
  el.nextBtn.addEventListener("click", next);
  el.againBtn.addEventListener("click", restart);

  restart();
})();
</script>
</body>
</html>
